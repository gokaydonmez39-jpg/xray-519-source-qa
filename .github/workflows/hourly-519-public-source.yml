name: XRAY 519 public Spot closed-bar research

on:
  schedule:
    - cron: '4 * * * *'
  # Run one new-source epoch after a reviewed code release; receipt pushes never retrigger.
  push:
    branches: [main]
    paths:
      - 'research_519.py'
      - 'bridge_519.py'
      - 'publish_bridge.py'
  workflow_dispatch:
    inputs:
      max_markets:
        description: 'Optional manual scope; scheduled jobs auto-stage 250 → 400 → 519'
        type: choice
        required: true
        default: '250'
        options:
          - '250'
          - '400'
          - '519'

permissions:
  contents: write

concurrency:
  group: xray-public-source-main
  cancel-in-progress: false

jobs:
  source-only:
    if: github.repository == 'gokaydonmez39-jpg/xray-519-source-qa' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout independent public research repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified signed v4 commit as of 2026-10-30
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Run security regression tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -q
          python3 -O -m unittest discover -s tests -q
      - name: Read-only Binance scan, immutable receipt and independent readback
        shell: bash
        env:
          MODE_INPUT: ${{ inputs.max_markets }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = schedule ] || [ "$EVENT_NAME" = push ]; then
            MODE="$(python3 select_scope.py)"
          else
            case "$MODE_INPUT" in 250|400|519) MODE="$MODE_INPUT" ;; *) exit 2 ;; esac
          fi
          # BEGIN_SOURCE_PREFLIGHT
          git fetch origin "${GITHUB_REF_NAME}"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/${GITHUB_REF_NAME}")" ]; then
            printf 'FAIL_CLOSED STALE_WORKFLOW_HEAD_NO_SCAN\n'
            exit 2
          fi
          CANDIDATE="receipts/$(date -u +%Y/%m/%d/%Y%m%dT%H00Z)-n${MODE}.json.gz"
          if [ -e "$CANDIDATE" ] || [ -L "$CANDIDATE" ]; then
            printf 'FAIL_CLOSED DUPLICATE_EPOCH_NO_SCAN\n'
            exit 2
          fi
          printf 'SOURCE_PREFLIGHT_ALLOW_SCAN\n'
          # END_SOURCE_PREFLIGHT
          OUT="$RUNNER_TEMP/source-receipt.json"
          BRIDGE="$RUNNER_TEMP/private-eligible-source.json.gz"
          if [ "$MODE" = 519 ]; then
            python3 research_519.py --max-markets "$MODE" --output "$OUT" --bridge-output "$BRIDGE" --pace 0.15
          else
            python3 research_519.py --max-markets "$MODE" --output "$OUT" --pace 0.15
          fi
          mapfile -t DETAILS < <(python3 publish_receipt.py --input "$OUT" --mode "$MODE")
          if [ "${#DETAILS[@]}" -ne 2 ]; then exit 2; fi
          FILE="${DETAILS[0]}"
          EXPECTED="${DETAILS[1]}"
          test -f "$FILE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$MODE" = 519 ]; then
            mapfile -t BDETAILS < <(python3 publish_bridge.py --bridge "$BRIDGE" --receipt "$OUT")
            if [ "${#BDETAILS[@]}" -ne 2 ]; then exit 2; fi
            BFILE="${BDETAILS[0]}"
            BEXPECTED="${BDETAILS[1]}"
            test -f "$BFILE"
            git add -- "$FILE" "$BFILE"
          else
            git add -- "$FILE"
          fi
          git commit -m "research: append immutable $MODE closed-bar receipt [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git fetch origin "${GITHUB_REF_NAME}"
          ACTUAL="$(git show "origin/${GITHUB_REF_NAME}:${FILE}" | sha256sum | cut -d' ' -f1)"
          test "$ACTUAL" = "$EXPECTED"
          if [ "$MODE" = 519 ]; then
            BACTUAL="$(git show "origin/${GITHUB_REF_NAME}:$BFILE" | sha256sum | cut -d' ' -f1)"
            test "$BACTUAL" = "$BEXPECTED"
            printf 'BRIDGE_REMOTE_READBACK_PASS path=%s sha256=%s mode=%s\n' "$BFILE" "$BACTUAL" "$MODE"
          fi
          printf 'RECEIPT_REMOTE_READBACK_PASS path=%s sha256=%s mode=%s\n' "$FILE" "$ACTUAL" "$MODE"
          python3 verify_remote_pair.py
