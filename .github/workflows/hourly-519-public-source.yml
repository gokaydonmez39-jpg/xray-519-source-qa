name: XRAY 519 public Spot closed-bar research

on:
  schedule:
    - cron: '4 * * * *'
    # Independent native opportunity if GitHub drops/delays :04.
    # Existing single concurrency group + authenticated same-hour no-op prevent extra scans.
    - cron: '8 * * * *'
  # Run one new-source epoch after a reviewed code release; receipt pushes never retrigger.
  push:
    branches: [main]
    paths:
      - 'research_519.py'
      - 'bridge_519.py'
      - 'publish_bridge.py'
      # Explicit, create-only hourly fallback when GitHub native cron is skipped.
      - 'ops/source-kicks/*.json'
  workflow_dispatch:
    inputs:
      max_markets:
        description: 'Optional manual scope; scheduled jobs auto-stage 250 → 400 → 519'
        type: choice
        required: true
        default: '250'
        options:
          - '250'
          - '400'
          - '519'

permissions:
  contents: write

concurrency:
  group: xray-public-source-main
  cancel-in-progress: false

jobs:
  source-only:
    if: github.repository == 'gokaydonmez39-jpg/xray-519-source-qa' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout independent public research repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified signed v4 commit as of 2026-10-30
        with:
          persist-credentials: true
          fetch-depth: 1
          # Keep the full Git tree and all receipts for pilot progression,
          # but materialize only the historical bridge fixtures used by tests.
          # Other bridge objects remain addressable by exact Git ref on demand.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.github/
            /ops/
            /research_lab/
            /tests/
            /receipts/
            /bridges/2026/11/03/20261103T1000Z-n518.json.gz
            /bridges/2026/11/06/20261106T1200Z-n518.json.gz
            /bridges/2026/11/06/20261106T1300Z-n518.json.gz
            /bridges/2026/11/06/20261106T1400Z-n518.json.gz
            /bridges/2026/11/06/20261106T1500Z-n518.json.gz
            /bridges/2026/11/07/20261107T1800Z-n518.json.gz
      - name: Run security regression tests
        run: |
          set -euo pipefail
          # Keep BOTH independent suites mandatory; do not alter admission.
          xray_regression_dir="$(mktemp -d "$RUNNER_TEMP/xray-regression.XXXXXXXX")"
          xray_normal_pid=
          xray_optimized_pid=
          xray_cleanup() {
            if [[ -n "$xray_normal_pid" ]]; then
              kill "$xray_normal_pid" 2>/dev/null || true
              wait "$xray_normal_pid" 2>/dev/null || true
            fi
            if [[ -n "$xray_optimized_pid" ]]; then
              kill "$xray_optimized_pid" 2>/dev/null || true
              wait "$xray_optimized_pid" 2>/dev/null || true
            fi
            rm -rf -- "$xray_regression_dir"
          }
          trap xray_cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          mkdir -p "$xray_regression_dir/normal-tmp" "$xray_regression_dir/optimized-tmp"
          TMPDIR="$xray_regression_dir/normal-tmp" python3 -m unittest discover -s tests -q >"$xray_regression_dir/normal.log" 2>&1 &
          xray_normal_pid=$!
          TMPDIR="$xray_regression_dir/optimized-tmp" python3 -O -m unittest discover -s tests -q >"$xray_regression_dir/optimized.log" 2>&1 &
          xray_optimized_pid=$!
          xray_normal_status=0
          xray_optimized_status=0
          wait "$xray_normal_pid" || xray_normal_status=$?
          xray_normal_pid=
          wait "$xray_optimized_pid" || xray_optimized_status=$?
          xray_optimized_pid=
          printf 'XRAY_SOURCE_GUARD normal exit=%s\n' "$xray_normal_status"
          cat "$xray_regression_dir/normal.log"
          printf 'XRAY_SOURCE_GUARD optimized exit=%s\n' "$xray_optimized_status"
          cat "$xray_regression_dir/optimized.log"
          if [[ "$xray_normal_status" != 0 || "$xray_optimized_status" != 0 ]]; then
            printf '%s\n' 'XRAY_SOURCE_SECURITY_REGRESSION_HOLD'
            exit 2
          fi
      - name: Read-only Binance scan, immutable receipt and independent readback
        shell: bash
        env:
          MODE_INPUT: ${{ inputs.max_markets }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = schedule ] || [ "$EVENT_NAME" = push ]; then
            MODE="$(python3 select_scope.py)"
          else
            case "$MODE_INPUT" in 250|400|519) MODE="$MODE_INPUT" ;; *) exit 2 ;; esac
          fi
          # BEGIN_SOURCE_PREFLIGHT
          # A delayed native schedule can start after a distinct public source
          # run already published this hour. Authenticate the exact immutable
          # remote 519 receipt+bridge before calling that redundant work a NOOP.
          # A NOOP is never a new source PASS or private AL authorization.
          git fetch origin "${GITHUB_REF_NAME}"
          STAMP="$(date -u +%Y%m%dT%H00Z)"
          PREFLIGHT_EXIT=0
          python3 -m ops.source_preflight --mode "$MODE" --stamp "$STAMP" || PREFLIGHT_EXIT=$?
          case "$PREFLIGHT_EXIT" in
            0) printf 'SOURCE_PREFLIGHT_ALLOW_SCAN_CONFIRMED\n' ;;
            20)
              printf 'SOURCE_ALREADY_PUBLISHED_NO_SCAN_NOT_NEW_SOURCE_PASS\n'
              exit 0
              ;;
            *)
              printf 'FAIL_CLOSED SOURCE_PREFLIGHT_BLOCKED\n'
              exit 2
              ;;
          esac
          # END_SOURCE_PREFLIGHT
          SCAN_BASE="$(git rev-parse HEAD)"
          OUT="$RUNNER_TEMP/source-receipt.json"
          BRIDGE="$RUNNER_TEMP/private-eligible-source.json.gz"
          if [ "$MODE" = 519 ]; then
            python3 research_519.py --max-markets "$MODE" --output "$OUT" --bridge-output "$BRIDGE" --bridge-profile full-quality --pace 0.15
          else
            python3 research_519.py --max-markets "$MODE" --output "$OUT" --pace 0.15
          fi
          mapfile -t DETAILS < <(python3 publish_receipt.py --input "$OUT" --mode "$MODE")
          if [ "${#DETAILS[@]}" -ne 2 ]; then exit 2; fi
          FILE="${DETAILS[0]}"
          EXPECTED="${DETAILS[1]}"
          test -f "$FILE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$MODE" = 519 ]; then
            # Optional source diagnostics; never veto a verified primary source if log-only fails.
            python3 -m ops.bridge_reason_summary "$BRIDGE" || printf '%s\n' 'PUBLIC_DEFERRED_REASON_SUMMARY_HOLD_NONVETO'
            # Hummingbot v2.17 methods only: verify already-captured closed bars and
            # taker quote flow, no WSS, no network, no strategy and no new expense.
            # A research diagnostic HOLD never overrides the canonical source gate.
            python3 -m ops.hummingbot_public_flow_shadow "$BRIDGE" || printf '%s\n' 'HUMMINGBOT_PUBLIC_FLOW_SHADOW_HOLD_NONVETO'
            mapfile -t BDETAILS < <(python3 publish_bridge.py --bridge "$BRIDGE" --receipt "$OUT")
            if [ "${#BDETAILS[@]}" -ne 2 ]; then exit 2; fi
            BFILE="${BDETAILS[0]}"
            BEXPECTED="${BDETAILS[1]}"
            test -f "$BFILE"
            git add --sparse -- "$FILE" "$BFILE"
          else
            git add --sparse -- "$FILE"
          fi
          git commit -m "research: append immutable $MODE closed-bar receipt [skip ci]"
          if [ "$MODE" = 519 ]; then
            python3 publish_git.py --require-current-epoch --base "$SCAN_BASE" --branch "$GITHUB_REF_NAME" "$FILE" "$BFILE"
          else
            python3 publish_git.py --require-current-epoch --base "$SCAN_BASE" --branch "$GITHUB_REF_NAME" "$FILE"
          fi
          python3 verify_remote_pair.py
          # Secondary create-only proof on a separate evidence branch.
          # No extra scan, scheduled job, private ref switch, or Sheets write.
          # Failure in this unused shadow ref cannot veto primary source.
          if [ "$MODE" = 519 ]; then
            if python3 -m ops.evidence_ref_publisher \
              --code-base "$SCAN_BASE" \
              --evidence-origin "c0dd934f418956141697022505d7ce99112eab6f" \
              --shadow-source-main "$FILE" "$BFILE"; then
              printf '%s\n' 'EVIDENCE_SHADOW_REMOTE_PAIR_PASS_NOT_PRIVATE_DELIVERY'
            else
              printf '%s\n' 'EVIDENCE_SHADOW_HOLD_PRIMARY_SOURCE_UNCHANGED'
            fi
          fi
