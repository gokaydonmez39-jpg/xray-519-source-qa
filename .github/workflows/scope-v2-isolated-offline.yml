name: XRAY Scope V2 isolated full offline acceptance
on:
  push:
    branches: ['audit/scope-v2-full-offline-20261128']
    paths: ['.github/workflows/scope-v2-isolated-offline.yml']
permissions:
  contents: read
jobs:
  offline-bridge:
    if: github.repository == 'gokaydonmez39-jpg/xray-519-source-qa' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout public-only code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact candidate and unchanged trusted V1 bytes
        run: |
          set -euo pipefail
          test "$(git hash-object ops/versioned_scope_acceptance.py)" = 683754b0f15b3ba479f1e9bcb46e42d0b728959f
          test "$(git hash-object versioned_scope_v2.py)" = e85ccd6980a3da7834bdf7f32091be87da3521e8
          test "$(git hash-object audit_scope_v2/test_versioned_scope_v2.py)" = c5f843fd2388c4e498ee77881c93bdec98df5edb
          test "$(git hash-object audit_scope_v2/test_pinned_integration.py)" = 19a0ec21ef75466cce522d0a56a0a11965f753e3
          echo EXACT_FOUR_BLOBS_PASS
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Compile public source
        run: python3 -m compileall -q bridge_519.py publish_bridge.py research_519.py tests versioned_scope_v2.py audit_scope_v2
      - name: Run complete research and bridge regression twice
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -q
          python3 -O -m unittest discover -s tests -q
          python3 -m unittest ops.test_cloudflare_source_provenance -q
      - name: Run exact V2 offline candidate twice
        run: |
          set -euo pipefail
          python3 -m unittest discover -s audit_scope_v2 -q
          python3 -O -m unittest discover -s audit_scope_v2 -q
      - name: Confirm no trade endpoint was introduced
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import research_519 as r
          assert set(r.ALLOWED_PATHS)=={
              '/api/v3/time','/api/v3/exchangeInfo','/api/v3/ticker/24hr',
              '/api/v3/ticker/bookTicker','/api/v3/klines'}
          assert r.COUNTS == {'1h':100,'4h':40,'1d':40}
          assert r.BRIDGE_COUNTS == {'1h':100,'4h':70,'1d':60}
          print('BRIDGE_SOURCE_ONLY_PASS')
          PY
